<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataVista Pro - 多指标多图表可视化平台</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/charts.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-left">
                <h1 class="logo">DataVista Pro</h1>
                <span class="subtitle">多指标多图表可视化平台</span>
            </div>
            <div class="header-right">
                <button class="btn btn-secondary" id="taskManagerBtn">
                    <span class="icon">🤖</span> Agent任务管理
                </button>
                <button class="btn btn-primary" id="addIndicatorBtn">
                    <span class="icon">+</span> 添加指标
                </button>
                <button class="btn btn-secondary" id="themeToggle">
                    <span class="icon">◐</span> 主题切换
                </button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>控制面板</h2>
                </div>
                <div class="sidebar-content">
                    <div class="panel">
                        <h3>指标列表</h3>
                        <ul class="indicator-list" id="indicatorList">
                            <li class="indicator-item active" data-id="revenue">营收数据</li>
                            <li class="indicator-item" data-id="users">用户增长</li>
                            <li class="indicator-item" data-id="orders">订单量</li>
                            <li class="indicator-item" data-id="conversion">转化率</li>
                        </ul>
                    </div>
                    <div class="panel">
                        <h3>图表类型</h3>
                        <div class="chart-type-grid">
                            <button class="chart-type-btn active" data-type="line">
                                <span class="chart-icon">📈</span>
                                <span>折线图</span>
                            </button>
                            <button class="chart-type-btn" data-type="bar">
                                <span class="chart-icon">📊</span>
                                <span>柱状图</span>
                            </button>
                            <button class="chart-type-btn" data-type="pie">
                                <span class="chart-icon">🥧</span>
                                <span>饼图</span>
                            </button>
                            <button class="chart-type-btn" data-type="scatter">
                                <span class="chart-icon">⚬</span>
                                <span>散点图</span>
                            </button>
                            <button class="chart-type-btn" data-type="radar">
                                <span class="chart-icon">🕸️</span>
                                <span>雷达图</span>
                            </button>
                            <button class="chart-type-btn" data-type="gauge">
                                <span class="chart-icon">⚡</span>
                                <span>仪表盘</span>
                            </button>
                            <button class="chart-type-btn" data-type="heatmap">
                                <span class="chart-icon">🔥</span>
                                <span>热力图</span>
                            </button>
                            <button class="chart-type-btn" data-type="area">
                                <span class="chart-icon">⛰️</span>
                                <span>面积图</span>
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="dashboard">
                <div class="dashboard-header">
                    <h2>实时数据监控</h2>
                    <div class="dashboard-actions">
                        <select class="time-range-select" id="timeRange">
                            <option value="24h">最近24小时</option>
                            <option value="7d" selected>最近7天</option>
                            <option value="30d">最近30天</option>
                            <option value="90d">最近90天</option>
                        </select>
                        <button class="btn btn-small" id="refreshBtn">刷新数据</button>
                    </div>
                </div>

                <div class="dashboard-grid" id="dashboardGrid">
                    <div class="chart-card line-chart" data-chart-type="line">
                        <div class="card-header">
                            <h3>趋势分析</h3>
                            <div class="card-actions">
                                <button class="action-btn" title="全屏">⛶</button>
                                <button class="action-btn" title="导出">📥</button>
                                <button class="action-btn" title="设置">⚙️</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <canvas id="lineChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card bar-chart" data-chart-type="bar">
                        <div class="card-header">
                            <h3>分类对比</h3>
                            <div class="card-actions">
                                <button class="action-btn" title="全屏">⛶</button>
                                <button class="action-btn" title="导出">📥</button>
                                <button class="action-btn" title="设置">⚙️</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card pie-chart" data-chart-type="pie">
                        <div class="card-header">
                            <h3>占比分析</h3>
                            <div class="card-actions">
                                <button class="action-btn" title="全屏">⛶</button>
                                <button class="action-btn" title="导出">📥</button>
                                <button class="action-btn" title="设置">⚙️</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card scatter-chart" data-chart-type="scatter">
                        <div class="card-header">
                            <h3>关联分析</h3>
                            <div class="card-actions">
                                <button class="action-btn" title="全屏">⛶</button>
                                <button class="action-btn" title="导出">📥</button>
                                <button class="action-btn" title="设置">⚙️</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <canvas id="scatterChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card radar-chart" data-chart-type="radar">
                        <div class="card-header">
                            <h3>多维评估</h3>
                            <div class="card-actions">
                                <button class="action-btn" title="全屏">⛶</button>
                                <button class="action-btn" title="导出">📥</button>
                                <button class="action-btn" title="设置">⚙️</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <canvas id="radarChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card gauge-chart" data-chart-type="gauge">
                        <div class="card-header">
                            <h3>关键指标</h3>
                            <div class="card-actions">
                                <button class="action-btn" title="全屏">⛶</button>
                                <button class="action-btn" title="导出">📥</button>
                                <button class="action-btn" title="设置">⚙️</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <canvas id="gaugeChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card heatmap-chart" data-chart-type="heatmap">
                        <div class="card-header">
                            <h3>数据密度</h3>
                            <div class="card-actions">
                                <button class="action-btn" title="全屏">⛶</button>
                                <button class="action-btn" title="导出">📥</button>
                                <button class="action-btn" title="设置">⚙️</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <canvas id="heatmapChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card area-chart" data-chart-type="area">
                        <div class="card-header">
                            <h3>累积趋势</h3>
                            <div class="card-actions">
                                <button class="action-btn" title="全屏">⛶</button>
                                <button class="action-btn" title="导出">📥</button>
                                <button class="action-btn" title="设置">⚙️</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <canvas id="areaChart"></canvas>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/data/DataManager.js"></script>
    <script src="js/chart/ChartRenderer.js"></script>
    <script src="js/dashboard/DashboardController.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
